{% extends 'base.html' %}
{% block content %}
<div class=""p-3>
    <div class="container">
        <div class="row mt-3">
            <div class=""col mx-auto mb-3">
                <h2>Top Commenter</h2>
                <hr />
                {% if template_data.username %}
                <p>
                    <b>User:</b> {{ template_data.username }}
                </p>
                <p>
                    <b>Comments posted:</b> {{ template_data.comment_count }}
                </p>
                {% else %}
                <p>No comments have been posted yet.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock content %}
