{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Top Buyer</h2>
        <hr />

        {% if template_data.username %}

        <p>Top Buyer User: {{ template_data.username }}</p>
        <p>Movies purchased: {{ template_data.movies_purchased }}</p>
        {% else %}
        <p>No user had bought any movies yet</p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock content %}
